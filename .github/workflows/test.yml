name: Check TVM Discord Bot

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm audit --omit=dev --audit-level=moderate

    container:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - run: docker build -t tvm-discord-bot:test .
            - run: docker run --rm tvm-discord-bot:test node scripts/check-container.js
